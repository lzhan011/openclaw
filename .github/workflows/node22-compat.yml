name: Node 22 Compat

on:
  schedule:
    - cron: "23 5 * * 1"
  workflow_dispatch:
    inputs:
      proof_mode:
        description: Optional narrowly scoped proof lane
        required: false
        default: compat
        type: choice
        options: [compat, auth-order]
      target_ref:
        description: Exact 40-character commit SHA for the proof lane
        required: false
        default: ""
        type: string
      expected_outcome:
        description: Expected focused-test outcome for the proof lane
        required: false
        default: success
        type: choice
        options: [success, failure]

permissions:
  actions: read
  contents: read

jobs:
  compat:
    if: github.repository == 'openclaw/openclaw' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.proof_mode == 'auth-order' && inputs.target_ref || github.ref }}
          persist-credentials: false

      - name: Setup Node environment
        uses: ./.github/actions/setup-node-env
        with:
          cache-mode: restore
          node-version: "22.23.2"
          install-bun: "false"

      - name: Resolve trusted declaration cache artifact
        if: inputs.proof_mode != 'auth-order'
        id: declaration_cache
        env:
          ARTIFACT_NAME: build-all-cache-v1-Linux-X64-node-22.23.2
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          if ! runs_json="$(
            gh api \
              "repos/${GITHUB_REPOSITORY}/actions/workflows/node22-compat.yml/runs?branch=main&status=success&per_page=5" \
              2>/dev/null
          )"; then
            echo "::warning::Unable to list trusted Node 22 runs; continuing cold."
            exit 0
          fi

          while IFS=$'\t' read -r run_id source_sha; do
            [[ "$run_id" =~ ^[1-9][0-9]*$ && "$source_sha" =~ ^[0-9a-f]{40}$ ]] || continue
            if ! artifacts_json="$(
              gh api \
                "repos/${GITHUB_REPOSITORY}/actions/runs/${run_id}/artifacts?per_page=10" \
                2>/dev/null
            )"; then
              continue
            fi
            artifact_id="$(
              jq -r \
                --arg name "$ARTIFACT_NAME" \
                --arg run_id "$run_id" \
                'first(.artifacts[] | select(
                  .expired == false and
                  .name == $name and
                  (.workflow_run.id | tostring) == $run_id
                ) | .id) // empty' \
                <<<"$artifacts_json"
            )"
            if [[ ! "$artifact_id" =~ ^[1-9][0-9]*$ ]]; then
              continue
            fi
            echo "artifact_id=$artifact_id" >> "$GITHUB_OUTPUT"
            echo "run_id=$run_id" >> "$GITHUB_OUTPUT"
            echo "source_sha=$source_sha" >> "$GITHUB_OUTPUT"
            exit 0
          done < <(
            jq -r '
              .workflow_runs[] |
              select(
                .status == "completed" and
                .conclusion == "success" and
                .head_branch == "main" and
                (.path | split("@")[0]) == ".github/workflows/node22-compat.yml" and
                (.event == "schedule" or .event == "workflow_dispatch")
              ) |
              [.id, .head_sha] |
              @tsv
            ' <<<"$runs_json"
          )

      - name: Restore trusted declaration cache artifact
        if: steps.declaration_cache.outputs.artifact_id != ''
        continue-on-error: true
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          artifact-ids: ${{ steps.declaration_cache.outputs.artifact_id }}
          github-token: ${{ github.token }}
          merge-multiple: true
          path: .artifacts/build-all-cache
          repository: ${{ github.repository }}
          run-id: ${{ steps.declaration_cache.outputs.run_id }}

      - name: Configure Node test resources
        run: echo "OPENCLAW_VITEST_MAX_WORKERS=2" >> "$GITHUB_ENV"

      - name: Run Node 22 compatibility
        if: inputs.proof_mode != 'auth-order'
        env:
          NODE_OPTIONS: --max-old-space-size=8192
        run: |
          pnpm build
          pnpm ui:build
          node openclaw.mjs --help
          node openclaw.mjs status --json --timeout 1
          pnpm test:build:singleton

      - name: Run auth order proof
        if: inputs.proof_mode == 'auth-order'
        env:
          EXPECTED_OUTCOME: ${{ inputs.expected_outcome }}
          TARGET_REF: ${{ inputs.target_ref }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! "$TARGET_REF" =~ ^[0-9a-f]{40}$ ]]; then
            echo "target_ref must be a full commit SHA" >&2
            exit 1
          fi
          checked_out_sha="$(git rev-parse HEAD)"
          if [[ "$checked_out_sha" != "$TARGET_REF" ]]; then
            echo "checked out $checked_out_sha instead of $TARGET_REF" >&2
            exit 1
          fi

          mkdir -p .artifacts/auth-order-proof
          set +e
          node scripts/run-vitest.mjs src/commands/models/auth.test.ts --reporter=verbose \
            2>&1 | tee .artifacts/auth-order-proof/test.log
          test_status="${PIPESTATUS[0]}"
          set -e
          printf 'target_ref=%s\nexpected_outcome=%s\ntest_status=%s\n' \
            "$TARGET_REF" "$EXPECTED_OUTCOME" "$test_status" \
            > .artifacts/auth-order-proof/result.txt

          if [[ "$EXPECTED_OUTCOME" == "failure" ]]; then
            if [[ "$test_status" -eq 0 ]]; then
              echo "focused test unexpectedly passed" >&2
              exit 1
            fi
            grep -F "fails visibly when login cannot update the auth profile order" \
              .artifacts/auth-order-proof/test.log
            grep -F "promise resolved" .artifacts/auth-order-proof/test.log
            exit "$test_status"
          fi
          if [[ "$EXPECTED_OUTCOME" != "success" ]]; then
            echo "expected_outcome must be success or failure" >&2
            exit 1
          fi
          exit "$test_status"

      - name: Publish auth order proof
        if: always() && inputs.proof_mode == 'auth-order'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          if-no-files-found: error
          name: auth-order-proof-${{ inputs.target_ref }}-${{ inputs.expected_outcome }}
          path: .artifacts/auth-order-proof
          retention-days: 14

      - name: Publish trusted declaration cache artifact
        if: success() && inputs.proof_mode != 'auth-order' && github.repository == 'openclaw/openclaw' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          compression-level: 1
          if-no-files-found: error
          include-hidden-files: true
          name: build-all-cache-v1-${{ runner.os }}-${{ runner.arch }}-node-22.23.2
          overwrite: true
          path: .artifacts/build-all-cache
          retention-days: 14
